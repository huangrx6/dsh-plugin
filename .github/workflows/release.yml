# 打 tag（v*）时构建六个插件并把预构建的 npm tarball 挂到 GitHub Release。
#
# 版本号完全由 tag 驱动：打包前 CI 把 tag 号（去掉 v）写进每个
# package.json，tarball 文件名与包内 version 永远等于 tag 号。不需要
# 手动 bump 版本、也不需要 chore(release) 提交——仓库里的 version 字段
# 只是本地 pnpm pack 时的兜底，发布以 tag 为准。
#
# 每个包保留两个产物：
#   1) 版本化名（pnpm pack 默认，如 dsh-remote-access-0.7.0.tgz）——升级/
#      安装的主路径。URL 含版本号，pnpm 缓存按 URL 区分，永远不撞
#      TARBALL_INTEGRITY（latest 固定链接 + 内容变化是 integrity 冲突的
#      根因）。
#   2) 固定名（如 dsh-remote-access.tgz）——仅供 /releases/latest/download/
#      一次性试用；不用于升级。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stamp the tag version into every package.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must look like vX.Y.Z, got: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          for pkg in dsh-launcher dsh-layout dsh-skill-manager dsh-mcp-manager dsh-remote-access dsh-archive-manager dsh-agent-rules dsh-usage; do
            (cd "$pkg" && npm pkg set "version=$VERSION")
          done
          echo "all packages stamped as $VERSION"

      - name: Build & pack every plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          # Order matters: dsh-launcher goes first because dsh-skill-manager and
          # dsh-mcp-manager `link:` it via their workspace + market sections,
          # so its `lib/` has to exist before their build step resolves
          # `dsh-launcher/client/workspace` / `dsh-launcher/client/market`.
          for pkg in dsh-launcher dsh-layout dsh-skill-manager dsh-mcp-manager dsh-remote-access dsh-archive-manager dsh-agent-rules dsh-usage; do
            echo "::group::build $pkg"
            (cd "$pkg" && pnpm install --no-frozen-lockfile && pnpm run build && pnpm pack --pack-destination ../dist)
            echo "::endgroup::"
          done
          cd dist
          for f in *-*.tgz; do
            cp "$f" "$(basename "$f" | sed 's/-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*.*\.tgz$/.tgz/')"
          done
          ls -lh ./
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
