# 打 tag（v*）时构建四个插件并把预构建的 npm tarball 挂到 GitHub Release。
# 产物文件名固定（不含版本号），因此安装方永远可以用「latest」固定链接，
# 一条命令装最新版、无需知道 tag 号或各插件版本：
#   dsh plugin --profile web add \
#     https://github.com/huangrx6/dsh-plugin/releases/latest/download/dsh-layout.tgz
# npm tarball 内部仍带真实版本（package.json 的 version 字段），改名只影响
# 下载文件名，不影响 pnpm 解析。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build & pack every plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          for pkg in dsh-layout dsh-skill-manager dsh-mcp-manager dsh-remote-access; do
            echo "::group::build $pkg"
            (cd "$pkg" && pnpm install --no-frozen-lockfile && pnpm run build && pnpm pack --pack-destination ../dist)
            echo "::endgroup::"
          done
          # 每个包保留两个产物：
          #   1) 版本化名（pnpm pack 默认，如 dsh-remote-access-0.1.0.tgz）——升级/安装的
          #      主路径。URL 含版本号，pnpm 缓存按 URL 区分，永远不撞 TARBALL_INTEGRITY
          #      （latest 固定链接 + 内容变化是 integrity 冲突的根因）。
          #   2) 固定名（如 dsh-remote-access.tgz）——仅供 /releases/latest/download/
          #      一次性试用；不用于升级。
          cd dist
          for f in *-*.tgz; do
            cp "$f" "$(basename "$f" | sed 's/-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*.*\.tgz$/.tgz/')"
          done
          ls -lh ./
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
