# 打 tag（v*）时构建六个插件并把预构建的 npm tarball 挂到 GitHub Release。
#
# 版本号完全由 tag 驱动：打包前 CI 把 tag 号（去掉 v）写进每个
# package.json，tarball 文件名与包内 version 永远等于 tag 号。不需要
# 手动 bump 版本、也不需要 chore(release) 提交——仓库里的 version 字段
# 只是本地 pnpm pack 时的兜底，发布以 tag 为准。
#
# 每个包保留两个产物：
#   1) 版本化名（pnpm pack 默认，如 dsh-remote-access-0.7.0.tgz）——升级/
#      安装的主路径。URL 含版本号，pnpm 缓存按 URL 区分，永远不撞
#      TARBALL_INTEGRITY（latest 固定链接 + 内容变化是 integrity 冲突的
#      根因）。
#   2) 固定名（如 dsh-remote-access.tgz）——仅供 /releases/latest/download/
#      一次性试用；不用于升级。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Discover plugins and stamp version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must look like vX.Y.Z, got: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          # Auto-discover: any directory with a package.json that has a "dsh" field
          PLUGINS=()
          for dir in */; do
            [ -f "$dir/package.json" ] || continue
            node -e "const p=require('./$dir/package.json'); if(p.dsh) process.exit(0); else process.exit(1)" || continue
            PLUGINS+=("${dir%/}")
          done
          if [ ${#PLUGINS[@]} -eq 0 ]; then
            echo "no plugins found" >&2; exit 1
          fi
          echo "discovered plugins: ${PLUGINS[*]}"
          # dsh-launcher must build first — other plugins reference its lib/ output
          ORDERED=(dsh-launcher)
          for pkg in "${PLUGINS[@]}"; do
            [ "$pkg" = "dsh-launcher" ] || ORDERED+=("$pkg")
          done
          echo "build order: ${ORDERED[*]}"
          # Stamp version into every package.json
          for pkg in "${ORDERED[@]}"; do
            (cd "$pkg" && npm pkg set "version=$VERSION")
          done
          echo "all packages stamped as $VERSION"
          # Export for the next step
          printf '%s\n' "${ORDERED[@]}" > /tmp/dsh-plugins.txt

      - name: Build & pack every plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          PLUGINS=($(cat /tmp/dsh-plugins.txt))
          for pkg in "${PLUGINS[@]}"; do
            echo "::group::build $pkg"
            (cd "$pkg" && pnpm install --no-frozen-lockfile && pnpm run build && pnpm pack --pack-destination ../dist)
            echo "::endgroup::"
          done
          cd dist
          for f in *-*.tgz; do
            cp "$f" "$(basename "$f" | sed 's/-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*.*\.tgz$/.tgz/')"
          done
          ls -lh ./
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
