# 打 tag（v*）时构建四个插件并把预构建的 npm tarball 挂到 GitHub Release。
# 产物文件名固定（不含版本号），因此安装方永远可以用「latest」固定链接，
# 一条命令装最新版、无需知道 tag 号或各插件版本：
#   dsh plugin --profile web add \
#     https://github.com/huangrx6/dsh-plugin/releases/latest/download/dsh-layout.tgz
# npm tarball 内部仍带真实版本（package.json 的 version 字段），改名只影响
# 下载文件名，不影响 pnpm 解析。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build & pack every plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          for pkg in dsh-layout dsh-skill-manager dsh-mcp-manager dsh-remote-access; do
            echo "::group::build $pkg"
            (cd "$pkg" && pnpm install --no-frozen-lockfile && pnpm run build && pnpm pack --pack-destination ../dist)
            echo "::endgroup::"
          done
          # 去掉版本号后缀，让 /releases/latest/download/ 固定链接永远可用。
          # 例：dsh-remote-access-0.1.0.tgz → dsh-remote-access.tgz
          # （不 cd：包名本身不含连字符规则可靠，用路径内联操作避免改变 cwd）
          for f in dist/*-*.tgz; do
            mv "$f" "dist/$(basename "$f" | sed 's/-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*.*\.tgz$/.tgz/')"
          done
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
